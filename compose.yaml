services:
  lifekernel:
    build: .
    restart: unless-stopped
    environment:
      LIFEKERNEL_CONFIG: /config/lifekernel.config.json
      LIFEKERNEL_API_TOKEN: ${LIFEKERNEL_API_TOKEN:-}
      LIFEKERNEL_PUBLIC_URL: ${LIFEKERNEL_PUBLIC_URL:-}
      LIFEKERNEL_OWNER_SECRET: ${LIFEKERNEL_OWNER_SECRET:-}
      LIFEKERNEL_HOST: 0.0.0.0
      LIFEKERNEL_PORT: 8787
      LIFEKERNEL_ALLOWED_ORIGINS: ${LIFEKERNEL_ALLOWED_ORIGINS:-}
      LIFEKERNEL_SCHEDULER: ${LIFEKERNEL_SCHEDULER:-off}
      LIFEKERNEL_CALENDAR_TOKEN: ${LIFEKERNEL_CALENDAR_TOKEN:-}
      LIFEKERNEL_NTFY_TOPIC: ${LIFEKERNEL_NTFY_TOPIC:-}
      LIFEKERNEL_NTFY_URL: ${LIFEKERNEL_NTFY_URL:-}
      LIFEKERNEL_NTFY_TOKEN: ${LIFEKERNEL_NTFY_TOKEN:-}
      LIFEKERNEL_WEBHOOK_URL: ${LIFEKERNEL_WEBHOOK_URL:-}
      LIFEKERNEL_WEBHOOK_SECRET: ${LIFEKERNEL_WEBHOOK_SECRET:-}
    volumes:
      - ./lifekernel.config.json:/config/lifekernel.config.json:ro
      - ./vaults:/vaults
      - lifekernel-state:/state
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  lifekernel-state:
