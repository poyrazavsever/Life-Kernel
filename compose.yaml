services:
  lifekernel:
    # `docker compose pull` fetches the published image; `docker compose up -d --build` builds this checkout instead.
    image: ghcr.io/poyrazavsever/life-kernel:${LIFEKERNEL_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Run as the user that owns ./vaults so Obsidian on the host can still edit what the server writes.
    user: "${LIFEKERNEL_UID:-1000}:${LIFEKERNEL_GID:-1000}"
    environment:
      LIFEKERNEL_CONFIG: /config/lifekernel.config.json
      LIFEKERNEL_API_TOKEN: ${LIFEKERNEL_API_TOKEN:-}
      LIFEKERNEL_PUBLIC_URL: ${LIFEKERNEL_PUBLIC_URL:-}
      LIFEKERNEL_OWNER_SECRET: ${LIFEKERNEL_OWNER_SECRET:-}
      LIFEKERNEL_HOST: 0.0.0.0
      LIFEKERNEL_PORT: 8787
      LIFEKERNEL_ALLOWED_ORIGINS: ${LIFEKERNEL_ALLOWED_ORIGINS:-}
      LIFEKERNEL_SCHEDULER: ${LIFEKERNEL_SCHEDULER:-off}
      LIFEKERNEL_CALENDAR_TOKEN: ${LIFEKERNEL_CALENDAR_TOKEN:-}
      LIFEKERNEL_NTFY_TOPIC: ${LIFEKERNEL_NTFY_TOPIC:-}
      LIFEKERNEL_NTFY_URL: ${LIFEKERNEL_NTFY_URL:-}
      LIFEKERNEL_NTFY_TOKEN: ${LIFEKERNEL_NTFY_TOKEN:-}
      LIFEKERNEL_WEBHOOK_URL: ${LIFEKERNEL_WEBHOOK_URL:-}
      LIFEKERNEL_WEBHOOK_SECRET: ${LIFEKERNEL_WEBHOOK_SECRET:-}
      LIFEKERNEL_TELEGRAM_TOKEN: ${LIFEKERNEL_TELEGRAM_TOKEN:-}
      LIFEKERNEL_TELEGRAM_CHAT_ID: ${LIFEKERNEL_TELEGRAM_CHAT_ID:-}
      LIFEKERNEL_SMTP_URL: ${LIFEKERNEL_SMTP_URL:-}
      LIFEKERNEL_EMAIL_FROM: ${LIFEKERNEL_EMAIL_FROM:-}
      LIFEKERNEL_EMAIL_TO: ${LIFEKERNEL_EMAIL_TO:-}
      LIFEKERNEL_CAPTURE_TOKEN: ${LIFEKERNEL_CAPTURE_TOKEN:-}
      LIFEKERNEL_ACTION_SECRET: ${LIFEKERNEL_ACTION_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./lifekernel.config.json:/config/lifekernel.config.json:ro
      - ./vaults:/vaults
      - lifekernel-state:/state
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  lifekernel-state:
