version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    # Major jumps in these are migrations, not routine bumps, and are done on purpose, one at a time:
    # zod 4 changes the schema API the code and the MCP SDK use, TypeScript 7 is the Go rewrite, and
    # @types/node must stay on the Node line the project supports and tests (22).
    ignore:
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # The image follows an LTS Node line that CI also tests. Move it on purpose when 26 reaches LTS.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
