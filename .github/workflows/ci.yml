name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test
      - run: npm run fixture

  # Checks that do not depend on the operating system, run once on Linux.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails on a known high-severity vulnerability in anything the server ships.
      - run: npm audit --audit-level=high --omit=dev
      - name: Test coverage
        run: npm run coverage
      # Builds the image and runs it as a non-root user that is not uid 1000, with a bind-mounted git vault.
      - name: Docker image smoke test
        run: bash scripts/docker-smoke.sh
