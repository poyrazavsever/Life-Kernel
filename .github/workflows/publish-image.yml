name: Publish image

# Builds the Docker image for a release and pushes it to GitHub Container Registry, for amd64 and arm64.
# It runs when a release is published. To publish an older tag, or to retry, run it by hand with the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.2.0-beta.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the image name and tags
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          prerelease="${BASH_REMATCH[4]}"
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            # GitHub Container Registry names must be lowercase; the repository name is not.
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            # Before 1.0 every release is a beta, so "latest" follows the newest release. From 1.0 on,
            # a prerelease never takes "latest".
            if [ -z "$prerelease" ] || [ "$major" = "0" ]; then echo "latest=true"; else echo "latest=false"; fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      # A manual run starts from main, so github.sha is not the commit being built; the tag's commit is.
      - name: Record the commit that is built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Runs the image that was just pushed the way compose does: non-root, bind-mounted git vault, health check,
      # a 401 without a token, and a write that lands in git history. A failure here means the published image is bad.
      - name: Smoke test the published image
        env:
          SMOKE_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
        run: bash scripts/docker-smoke.sh

      - name: Summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "A package published for the first time is private. Open the package's settings on GitHub and change its visibility to Public once, so that anyone can pull it."
          } >> "$GITHUB_STEP_SUMMARY"
